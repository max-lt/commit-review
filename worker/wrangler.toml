# The remote side of commit-review: a worker serving the review UI from
# ../ui and one Durable Object per GitHub user holding the pending reviews.
name = "commit-review"
main = "src/index.js"
compatibility_date = "2026-06-01"
routes = [{ pattern = "commit-review.lechat.dev", custom_domain = true }]

[assets]
directory = "../ui"
binding = "ASSETS"
run_worker_first = true
# The worker picks the page; no redirects to extension-less paths.
html_handling = "none"

[[durable_objects.bindings]]
name = "USER"
class_name = "UserBox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserBox"]

[vars]
# Client ID of a GitHub OAuth App with "Enable Device Flow" checked. No
# secret is needed for the device flow.
GITHUB_CLIENT_ID = "Ov23liAesxjjej5RQvGm"
