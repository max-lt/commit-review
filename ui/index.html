<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commit review</title>
<style>
  :root { color-scheme: light dark; font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  body { margin: 0; padding: 18px 24px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 16px; margin: 0; }
  .repo { opacity: .7; font-size: 12px; word-break: break-all; margin-top: -8px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin-bottom: 4px; }
  .label .opt { text-transform: none; letter-spacing: 0; }
  .subject { font-weight: 600; font-size: 15px; padding: 8px 12px; border-radius: 8px; background: rgba(127,127,127,.12); white-space: pre-wrap; word-break: break-word; }
  .badge { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 10px; background: #d1242f; color: #fff; font-size: 10px; letter-spacing: 0; text-transform: none; }
  mark.bad { background: #d1242f; color: #fff; border-radius: 3px; padding: 0 2px; }
  pre { margin: 0; padding: 8px 12px; overflow: auto; border-radius: 8px; background: rgba(127,127,127,.12); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  pre.body { margin-top: 6px; max-height: 160px; }
  pre.err { color: #d1242f; }
  .muted { opacity: .6; font-style: italic; }
  section.files { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  section.files pre { flex: 1; white-space: pre; }
  details summary { cursor: pointer; font-size: 12px; opacity: .7; }
  details pre { margin-top: 6px; max-height: 120px; }
  textarea { width: 100%; box-sizing: border-box; font: 13px/1.45 -apple-system, system-ui, sans-serif; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35); background: rgba(127,127,127,.08); color: inherit; resize: vertical; }
  textarea:focus { outline: 2px solid #2f6feb; outline-offset: -1px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(127,127,127,.4); background: transparent; color: inherit; cursor: pointer; }
  button.accept { background: #2f6feb; border-color: #2f6feb; color: #fff; }
  button.deny { color: #d1242f; border-color: #d1242f; }
  kbd { opacity: .6; font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>
  <h1>Claude wants to commit</h1>
  <div class="repo" id="repo">...</div>

  <section id="message">
    <div class="label" id="message-label">Commit message</div>
    <div class="subject" id="subject">...</div>
    <pre class="body" id="body" hidden></pre>
  </section>

  <section class="files">
    <div class="label">Files</div>
    <pre id="status">Reading git status...</pre>
  </section>

  <details id="raw" hidden>
    <summary>Exact command</summary>
    <pre id="command"></pre>
  </details>

  <section class="reason">
    <div class="label">Deny reason <span class="opt">(optional, read by Claude)</span></div>
    <textarea id="reason" rows="3" placeholder="e.g. split the refactor from the fix; the message does not say why"></textarea>
  </section>

  <div class="actions">
    <button class="deny" id="deny">Deny<kbd>esc</kbd></button>
    <button class="accept" id="accept">Accept<kbd>cmd+enter</kbd></button>
  </div>
<script>
  const { invoke } = window.__TAURI__.core;
  const DEFAULT_DENY = "Commit denied by human review, no reason given. Do not retry the commit: ask Max what should change.";
  const $ = (id) => document.getElementById(id);

  const denyReason = () => {
    const text = $("reason").value.trim();
    return text ? "Commit denied by human review. Reason:\n" + text : DEFAULT_DENY;
  };
  const decide = (accept) => invoke("decide", { accept, reason: accept ? "" : denyReason() });
  $("accept").onclick = () => decide(true);
  $("deny").onclick = () => decide(false);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") decide(false);
    if (e.key === "Enter" && e.metaKey) decide(true);
  });

  // Renders text with each reported character wrapped in a <mark>; characters
  // that would be invisible (controls, exotic spaces) show their code point.
  const render = (el, text, issues) => {
    el.textContent = "";
    const bad = new Map(issues.map((i) => [i.index, i.code]));
    let run = "";
    const flush = () => { if (run) { el.appendChild(document.createTextNode(run)); run = ""; } };
    [...text].forEach((ch, i) => {
      if (!bad.has(i)) { run += ch; return; }
      flush();
      const code = bad.get(i);
      const hex = "U+" + code.toString(16).toUpperCase().padStart(4, "0");
      const m = document.createElement("mark");
      m.className = "bad";
      m.title = hex;
      m.textContent = (code < 33 || code === 127 || /\s/.test(ch)) ? "<" + hex + ">" : ch;
      el.appendChild(m);
    });
    flush();
  };
  const badge = (name, count) => {
    if (!count) return;
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = name + ": " + count + " non-ASCII";
    $("message-label").appendChild(b);
  };

  $("reason").focus();
  invoke("context").then(({ repo, status, command, message, ascii_issues }) => {
    $("repo").textContent = repo;
    $("status").textContent = status || "(no changes)";
    if (command) {
      $("command").textContent = command;
      $("raw").hidden = false;
    }
    if (message) {
      render($("subject"), message.subject, ascii_issues.subject);
      badge("subject", ascii_issues.subject.length);
      if (message.body) {
        render($("body"), message.body, ascii_issues.body);
        badge("body", ascii_issues.body.length);
        $("body").hidden = false;
      }
    } else {
      $("subject").textContent = command ? "(message not recognized, see the exact command)" : "(manual launch, no command given)";
      $("subject").classList.add("muted");
    }
  }).catch((e) => {
    $("status").textContent = "git error: " + e;
    $("status").classList.add("err");
  });
</script>
</body>
</html>
