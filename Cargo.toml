[package]
name = "commit-review"
version = "0.1.0"
edition = "2021"
description = "Human review gate before a commit started by a coding agent"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking", "json"] }
libc = "0.2"

[profile.release]
strip = true
