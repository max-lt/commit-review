[package]
name = "commit-review"
version = "0.1.0"
edition = "2021"
description = "Human review gate before a commit started by Claude Code"

[dependencies]
# Our fork of https://github.com/nicoburniske/blit, branch gpu, pinned.
blit = { git = "https://github.com/max-lt/blit", rev = "abc91fad00beebeec18c42b4e047047b30e4bcbe" }
blit-cpu = { git = "https://github.com/max-lt/blit", rev = "abc91fad00beebeec18c42b4e047047b30e4bcbe" }
blit-desktop = { git = "https://github.com/max-lt/blit", rev = "abc91fad00beebeec18c42b4e047047b30e4bcbe", features = ["gpu"] }
blit-text = { git = "https://github.com/max-lt/blit", rev = "abc91fad00beebeec18c42b4e047047b30e4bcbe" }
blit-text-cosmic = { git = "https://github.com/max-lt/blit", rev = "abc91fad00beebeec18c42b4e047047b30e4bcbe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
strip = true
