[package]
name = "commit-review"
version = "0.1.0"
edition = "2021"
description = "Human review gate before a commit started by Claude Code"

[dependencies]
# A local clone of https://github.com/nicoburniske/blit, at 1235e17.
blit = { path = "../../forks/blit/kernel" }
blit-cpu = { path = "../../forks/blit/render/cpu" }
blit-desktop = { path = "../../forks/blit/platform/desktop" }
blit-text = { path = "../../forks/blit/render/text" }
blit-text-cosmic = { path = "../../forks/blit/render/text-cosmic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
strip = true
